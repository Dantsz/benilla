[package]
name = "benilla-srp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WoW 1.12.1 (build 5875) SRP6 client and world-header crypto"

[lints]
workspace = true

[dependencies]
num-bigint = "0.4.6"
sha1.workspace = true
rand = "0.8.6"

# `rand` 0.8 draws through `getrandom` 0.2, which reaches the browser's crypto only with `js`.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
